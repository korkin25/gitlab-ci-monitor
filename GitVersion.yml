---
# GitVersion — the single source of the version (image, chart, package/extension).
# Branching model: feature/* -> dev -> rc -> release. No `main` branch, NO git tags.
#
# This is a clean GitVersion 6.x config. (An older "5.x-style" config breaks with a
# `next-version` under GitVersion 6.8+: "Failed to parse X into a Semantic Version".
# That is why it was rewritten from scratch — keep it minimal and 6.x-native.)
#
# Per branch the release.yml picks the right variable:
#   rc       -> SemVer          e.g. 0.1.0-rc.8   (pre-release publish)
#   release  -> MajorMinorPatch e.g. 0.1.0        (clean, stable publish)
#
# THE ONE VERSION KNOB is `next-version`. There are no tags, so bump it to cut a new
# minor/major, then merge dev -> rc -> release.
#
# ODD/EVEN MINOR SCHEME (GCM-23). The Marketplace keeps ONE increasing version
# line across the pre-release and stable channels, so we split them by parity:
#   * `next-version` is the target STABLE and MUST be an EVEN minor (e.g. 0.8.0).
#   * `release` publishes that even-minor X.Y.Z (stable).
#   * `rc` publishes the ODD minor just below it — X.(Y-1).<preReleaseNumber> —
#     via release.yml, so every pre-release sits strictly below the stable it
#     leads to, and above the previous cycle's stable.
# For that X.(Y-1) math to hold, `rc` must NOT increment the minor: it keeps
# MajorMinorPatch == next-version (increment: None), and release.yml subtracts
# one minor.
#
# Before GCM-23, `rc` had `increment: Minor`, so GitVersion computed one minor
# ABOVE next-version and `MINOR-1` landed back ON the stable's even minor — they
# collided and a pre-release could outrank the stable. That shipped 0.6.10 as a
# pre-release, so next-version now starts at 0.8.0: a clean even minor above the
# burned 0.6.10.
mode: ContinuousDelivery
# Even minor = the next STABLE target. Bump by TWO each stable cycle (odd minors
# are the pre-release channel): 0.8.0 shipped, so the next cycle heads to 0.10.0
# — its rc pre-releases are 0.9.<N> (odd, above 0.8.0); its stable is 0.10.0.
next-version: 0.10.0

branches:
    dev:
        regex: ^(origin/)?dev(elop)?(ment)?$
        label: dev
        increment: Patch
        is-main-branch: true
        source-branches: [feature, hotfix]
    rc:
        regex: ^(origin/)?rc$
        label: rc
        increment: None
        source-branches: [dev]
    release:
        regex: ^(origin/)?release$
        label: ''
        increment: Patch
        is-release-branch: true
        source-branches: [rc, dev]
    feature:
        regex: ^(origin/)?features?[-/]
        label: alpha
        increment: Inherit
        source-branches: [dev]
    hotfix:
        regex: ^(origin/)?hotfix(es)?[-/]
        label: hotfix
        increment: Patch
        source-branches: [dev, release]
