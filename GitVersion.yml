---
# GitVersion — the single source of the version (the .vsix / marketplace version).
# Branching model: feature/* -> dev -> rc -> release. No hand-written versions.
#
# SCHEME: each promotion bumps a higher SemVer position, so the stage a change is
# in maps to a version lane (steady state, once a stable tag exists):
#
#   branch    increment   channel          published
#   ------    ---------   -------          ---------
#   dev       Patch       (not published)  X.0.1, X.0.2  (local test builds)
#   rc        Minor       pre-release       X.1.0, X.1.1  (--pre-release publish)
#   release   Major       stable           (X+1).0.0     (clean publish)
#
# So: patch-iterate on `dev`; merge to `rc` -> bumps MINOR and publishes a
# pre-release; keep merging to `rc` for more; merge to `release` -> bumps MAJOR and
# publishes the stable. Every publish is strictly greater than the last across BOTH
# channels (rc on a new minor, release on a new major), which is all the Marketplace
# requires (it shares one increasing version line and rejects a `-rc.N` suffix).
#
# release.yml maps GitVersion's output to a plain X.Y.Z:
#   rc      -> major.minor.<preReleaseNumber>   (commit counter drives increasing patch)
#   release -> majorMinorPatch
#
# THE ONE KNOB is `next-version`. After a stable ships, its tag (vX.Y.Z) becomes the
# floor and the branch increments drive everything; `next-version` only seeds the
# first cycle. It is 0.10.0 here to start rc at 0.10.x — clear of the already-published
# 0.9.4 pre-release (a higher next-version suppresses rc's minor bump, so in THIS first
# cycle dev and rc share minor 10; from the next cycle on, tags make dev/rc/release
# land on the patch/minor/major lanes shown above).
mode: ContinuousDelivery
next-version: 0.10.0

branches:
    dev:
        regex: ^(origin/)?dev(elop)?(ment)?$
        label: dev
        increment: Patch
        is-main-branch: true
        source-branches: [feature, hotfix]
    rc:
        regex: ^(origin/)?rc$
        label: rc
        increment: Minor
        source-branches: [dev]
    release:
        regex: ^(origin/)?release$
        label: ''
        increment: Major
        is-release-branch: true
        source-branches: [rc, dev]
    feature:
        regex: ^(origin/)?features?[-/]
        label: alpha
        increment: Inherit
        source-branches: [dev]
    hotfix:
        regex: ^(origin/)?hotfix(es)?[-/]
        label: hotfix
        increment: Patch
        source-branches: [dev, release]
