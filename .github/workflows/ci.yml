name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint (ESLint)
              run: npm run lint

            - name: Format check (Prettier)
              run: npm run format:check

            - name: Typecheck / compile (tsc)
              run: npm run compile

            - name: Test
              run: npm test

            - name: Dependency audit
              run: npm audit --audit-level=high || true
