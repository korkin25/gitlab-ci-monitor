# CI for the gitlab-ci-monitor VS Code extension.
#
# Three layers:
#   version — REUSES korkin25/open-ci-actions@v1 gitversion to prove the repo's
#             GitVersion.yml parses and computes a SemVer on every push/PR (the
#             version source release.yml depends on). Needs a full-history checkout.
#   sast    — REUSES the language-agnostic security gates from the public
#             korkin25/open-ci-actions@v1 (gitleaks, semgrep, checkov, trivy-config).
#             has-python/has-dockerfile are false: the Python- and Dockerfile-only
#             jobs inside sast.yml skip themselves. New shared CI logic belongs there.
#   node    — BESPOKE Node/TypeScript gates (open-ci-actions has no Node workflow yet):
#             eslint, prettier --check, tsc typecheck, node --test, and a `vsce package`
#             smoke that proves the .vsix builds. If a second Node project appears,
#             promote these into open-ci-actions rather than copying them.
#
# Publishing is NOT here — a merge to `rc` (pre-release) or `release` (stable)
# triggers the vendored release.yml (no tags; version from GitVersion).
name: CI

on:
    push:
        branches: ['**']
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Prove the version source (GitVersion.yml) parses and computes a SemVer on
    # every push/PR — the same number release.yml publishes on a merge to rc/release.
    version:
        name: Version
        runs-on: ubuntu-latest
        outputs:
            semver: ${{ steps.gitversion.outputs.semver }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # required: GitVersion needs the full history
            - id: gitversion
              uses: korkin25/open-ci-actions/actions/gitversion@v1

    # Language-agnostic security gates, reused from open-ci-actions.
    sast:
        name: SAST
        permissions:
            contents: read
            security-events: write # lets the scanners publish SARIF to the Security tab
        uses: korkin25/open-ci-actions/.github/workflows/sast.yml@v1
        with:
            has-python: 'false'
            has-dockerfile: 'false'
            semgrep-configs: p/javascript p/typescript p/security-audit p/secrets

    # Bespoke Node/TypeScript quality gates + packaging smoke.
    node:
        name: Node (lint/typecheck/test/package)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint (ESLint)
              run: npm run lint

            - name: Format check (Prettier)
              run: npm run format:check

            - name: Typecheck / compile (tsc)
              run: npm run compile

            - name: Test (node --test)
              run: npm test

            - name: Dependency audit (report)
              run: npm audit --audit-level=high || true

            - name: Package (.vsix smoke)
              run: npm run package

            - name: Upload .vsix artifact
              uses: actions/upload-artifact@v4
              with:
                  name: vsix
                  path: '*.vsix'
                  if-no-files-found: error
