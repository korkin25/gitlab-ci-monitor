name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + prettier, if configured)
        run: |
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
            npx --no-install eslint . || true
          else
            echo "No ESLint config found — skipping lint."
          fi
          if ls .prettierrc* prettier.config.* >/dev/null 2>&1; then
            npx --no-install prettier --check . || true
          else
            echo "No Prettier config found — skipping format check."
          fi

      - name: Typecheck / compile (tsc)
        run: npm run compile --if-present

      - name: Test (the project's runner, if configured)
        run: npm test --if-present

      - name: Dependency audit
        run: npm audit --audit-level=high || true
