name: Release

# A SemVer tag (v1.2.3) triggers the release: the full quality gate runs, a .vsix
# is built and attached to a GitHub Release, and — only when the matching token
# secret is configured — the extension is published to the marketplaces.
on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write # create the GitHub Release and upload the .vsix asset

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            VSCE_PAT: ${{ secrets.VSCE_PAT }}
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify tag matches package.json version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$PKG" ]; then
                    echo "::error::Tag v$TAG does not match package.json version $PKG" >&2
                    exit 1
                  fi

            - name: Quality gate (lint, format, compile, test)
              run: |
                  npm run lint
                  npm run format:check
                  npm run compile
                  npm test

            - name: Package VSIX
              run: |
                  npx --yes @vscode/vsce package --no-dependencies
                  echo "VSIX=$(ls *.vsix)" >> "$GITHUB_ENV"

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ env.VSIX }}
                  path: ${{ env.VSIX }}

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cat > release-notes.md <<EOF
                  ### Install

                  Download **$VSIX** from the assets below, then in VS Code either:

                  - open the Command Palette and run **Extensions: Install from VSIX…**, then pick the file, or
                  - run \`code --install-extension $VSIX\` from a terminal.

                  **What's new:** see the [CHANGELOG](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md).
                  EOF
                  gh release create "$GITHUB_REF_NAME" "$VSIX" \
                    --title "$GITHUB_REF_NAME" \
                    --notes-file release-notes.md \
                    --generate-notes

            # Publishing is opt-in: each step runs only when its token secret is set.
            - name: Publish to VS Code Marketplace
              if: ${{ env.VSCE_PAT != '' }}
              run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "$VSIX"

            - name: Publish to Open VSX
              if: ${{ env.OVSX_PAT != '' }}
              run: npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"
