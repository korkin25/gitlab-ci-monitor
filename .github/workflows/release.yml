# Release — vendored, canonical for the standard (VS Code extension variant).
#
# NO TAGS. A merge into `rc` or `release` IS the release:
#   * merge to `rc`      -> pre-release publish  (vsce/ovsx publish --pre-release)
#   * merge to `release` -> stable publish       (vsce/ovsx publish)
# The version comes entirely from GitVersion (the single source — GitVersion.yml,
# knob `next-version`). No version is hardcoded and no git tag is ever created;
# release.yml sets package.json from GitVersion at publish time via `npm version`.
#
# VERSIONING CONVENTION. Marketplace versions must be plain X.Y.Z — a `-rc.N` SemVer
# suffix is NOT accepted by the VS Code Marketplace. Pre-releases therefore publish a
# *distinct, increasing* X.Y.Z with the `--pre-release` flag rather than a SemVer
# pre-release suffix:
#   * release: V = majorMinorPatch                    (e.g. 0.5.0), stable
#   * rc:      V = <major>.<minor>.<preReleaseNumber> (e.g. 0.5.8), --pre-release
# Future refinement: Microsoft recommends reserving ODD minor numbers for pre-releases
# and EVEN minors for stable, so the two streams never collide on a version — adopt
# that when the release cadence needs it. See
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension#prerelease-extensions
#
# Publishing is opt-in: each marketplace step runs only when its token secret is set
# (VSCE_PAT for the VS Code Marketplace, OVSX_PAT for Open VSX).
name: Release

on:
    push:
        branches: [rc, release]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build & publish the extension
        runs-on: ubuntu-latest
        env:
            VSCE_PAT: ${{ secrets.VSCE_PAT }}
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # GitVersion needs full history

            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v3
              with:
                  versionSpec: '6.x' # latest GitVersion 6.x

            - name: Determine version (GitVersion)
              id: gv
              uses: gittools/actions/gitversion/execute@v3

            - name: Resolve the publish version (rc = pre-release, release = clean)
              id: ver
              env:
                  MAJOR: ${{ steps.gv.outputs.major }}
                  MINOR: ${{ steps.gv.outputs.minor }}
                  MMP: ${{ steps.gv.outputs.majorMinorPatch }}
                  PRE: ${{ steps.gv.outputs.preReleaseNumber }}
              run: |
                  set -euo pipefail
                  if [ "${{ github.ref_name }}" = "release" ]; then
                    V="$MMP"                       # clean X.Y.Z, stable
                    PRERELEASE=false
                  else
                    V="${MAJOR}.${MINOR}.${PRE}"   # distinct increasing X.Y.Z for --pre-release
                    PRERELEASE=true
                  fi
                  echo "version=$V" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "Publishing $V from '${{ github.ref_name }}' (pre-release=$PRERELEASE)"

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Set package.json version from GitVersion (no git tag)
              run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Package VSIX
              run: |
                  npm run package
                  echo "VSIX=$(ls -- *.vsix)" >> "$GITHUB_ENV"

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.VSIX }}
                  path: ${{ env.VSIX }}
                  if-no-files-found: error

            # Publishing is opt-in: each step runs only when its token secret is set.
            # vsce repackages from source at publish time (its recommended --pre-release
            # flow); the uploaded .vsix above is for manual install / record.
            - name: Publish to VS Code Marketplace
              if: ${{ env.VSCE_PAT != '' }}
              run: |
                  if [ "${{ steps.ver.outputs.prerelease }}" = 'true' ]; then
                    npx --yes @vscode/vsce publish --pre-release --no-dependencies -p "$VSCE_PAT"
                  else
                    npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
                  fi

            - name: Skip VS Code Marketplace publish (no token)
              if: ${{ env.VSCE_PAT == '' }}
              run: echo "VSCE_PAT not set — skipping marketplace publish"

            # ovsx publishes the already-built .vsix (the proven form for this repo).
            - name: Publish to Open VSX
              if: ${{ env.OVSX_PAT != '' }}
              run: |
                  if [ "${{ steps.ver.outputs.prerelease }}" = 'true' ]; then
                    npx --yes ovsx publish "$VSIX" --pre-release -p "$OVSX_PAT"
                  else
                    npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"
                  fi

            - name: Skip Open VSX publish (no token)
              if: ${{ env.OVSX_PAT == '' }}
              run: echo "OVSX_PAT not set — skipping Open VSX publish"
