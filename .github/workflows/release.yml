# Release — vendored, canonical for the standard (VS Code extension variant).
#
# NO TAGS. A merge into `rc` or `release` IS the release:
#   * merge to `rc`      -> pre-release publish  (vsce/ovsx publish --pre-release)
#   * merge to `release` -> stable publish       (vsce/ovsx publish)
# The version comes entirely from GitVersion (the single source — GitVersion.yml,
# knob `next-version`). No version is hardcoded and no git tag is ever created;
# release.yml sets package.json from GitVersion at publish time via `npm version`.
#
# VERSIONING CONVENTION. Marketplace versions must be plain X.Y.Z — a `-rc.N` SemVer
# suffix is NOT accepted, so we publish plain, strictly-increasing X.Y.Z on both
# channels. Each promotion bumps a higher SemVer position (see GitVersion.yml):
#   * rc      -> pre-release: V = major.minor.<preReleaseNumber>  (e.g. 0.10.0, 0.10.1)
#               `rc` bumps the MINOR, and the commit counter drives the patch, so a
#               cycle's pre-releases increase; published with `--pre-release`.
#   * release -> stable:      V = majorMinorPatch                 (e.g. 1.0.0)
#               `release` bumps the MAJOR, so the stable is above every pre-release.
# Because rc lands on a new minor and release on a new major, every publish is
# strictly greater than the last across both channels — the only Marketplace rule.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension#prerelease-extensions
#
# Publishing is opt-in: each marketplace step runs only when its token secret is set
# (VSCE_PAT for the VS Code Marketplace, OVSX_PAT for Open VSX).
name: Release

on:
    push:
        branches: [rc, release]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build & publish the extension
        runs-on: ubuntu-latest
        permissions:
            contents: write # create the git tag + GitHub Release (stable only)
        env:
            VSCE_PAT: ${{ secrets.VSCE_PAT }}
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # GitVersion needs full history

            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v3
              with:
                  versionSpec: '6.x' # latest GitVersion 6.x

            - name: Determine version (GitVersion)
              id: gv
              uses: gittools/actions/gitversion/execute@v3

            - name: Resolve the publish version (rc = pre-release, release = clean)
              id: ver
              env:
                  MAJOR: ${{ steps.gv.outputs.major }}
                  MINOR: ${{ steps.gv.outputs.minor }}
                  MMP: ${{ steps.gv.outputs.majorMinorPatch }}
                  PRE: ${{ steps.gv.outputs.preReleaseNumber }}
              run: |
                  set -euo pipefail
                  # Marketplace has no pre-release SUFFIX — versions are one increasing
                  # X.Y.Z line + a --pre-release flag. Each stage lands on a higher SemVer
                  # position (GitVersion.yml): rc bumps the MINOR (pre-release), release
                  # bumps the MAJOR (stable). rc's patch is the commit counter so a cycle's
                  # pre-releases increase; release publishes the clean majorMinorPatch.
                  if [ "${{ github.ref_name }}" = "release" ]; then
                    V="$MMP"                        # stable, e.g. 1.0.0 (Major bump)
                    PRERELEASE=false
                  else
                    V="${MAJOR}.${MINOR}.${PRE}"    # pre-release, e.g. 0.10.<commit count>
                    PRERELEASE=true
                  fi
                  echo "version=$V" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "Publishing $V from '${{ github.ref_name }}' (pre-release=$PRERELEASE)"

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Set package.json version from GitVersion (no git tag)
              run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Package VSIX
              run: |
                  npm run package
                  echo "VSIX=$(ls -- *.vsix)" >> "$GITHUB_ENV"

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.VSIX }}
                  path: ${{ env.VSIX }}
                  if-no-files-found: error

            # Publishing is opt-in: each step runs only when its token secret is set —
            # without a token the step just shows as skipped (no separate "skipped" step).
            # vsce repackages from source at publish time (its recommended --pre-release
            # flow); the uploaded .vsix above is for manual install / record.
            - name: Publish to VS Code Marketplace
              if: ${{ env.VSCE_PAT != '' }}
              run: |
                  if [ "${{ steps.ver.outputs.prerelease }}" = 'true' ]; then
                    npx --yes @vscode/vsce publish --pre-release --no-dependencies -p "$VSCE_PAT"
                  else
                    npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
                  fi

            # ovsx publishes the already-built .vsix. Notes vs vsce:
            #   * ovsx ignores --pre-release on a prepackaged .vsix, so we never pass it.
            #   * the publisher namespace must exist on Open VSX — create it idempotently.
            #   * Open VSX is secondary (the VS Code Marketplace is the primary target), so this
            #     step is non-fatal: a namespace/registry hiccup must not fail the release.
            - name: Publish to Open VSX
              if: ${{ env.OVSX_PAT != '' }}
              continue-on-error: true
              run: |
                  PUB=$(node -p "require('./package.json').publisher")
                  npx --yes ovsx create-namespace "$PUB" -p "$OVSX_PAT" || true
                  npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"

            # GitHub Release — STABLE only. A `release`-branch build tags `vX.Y.Z` at
            # this commit and cuts a GitHub Release with auto-generated notes and the
            # built `.vsix` attached ($VSIX, set by the Package step). rc (pre-release)
            # publishes to the marketplaces only — no tag — so pre-release tags never
            # confuse GitVersion (the version stays driven by `next-version`; auto-tags
            # sit below it and are ignored as long as you bump `next-version` next).
            - name: GitHub Release (stable only)
              if: ${{ github.ref_name == 'release' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  V="${{ steps.ver.outputs.version }}"
                  gh release create "v$V" \
                    --target "${{ github.sha }}" \
                    --title "v$V" \
                    --generate-notes \
                    "$VSIX"
